<!-- Input Component -->
<footer class="input-area" role="form" aria-label="Chat input">
  <button class="scroll-down-btn" id="scrollDownBtn" title="Scroll to bottom" aria-label="Scroll to bottom">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M8 3v10"/>
      <path d="M4 9l4 4 4-4"/>
    </svg>
  </button>
  <div class="thinking-indicator" id="thinkingIndicator" role="status" aria-live="polite">
    <div class="thinking-dots" aria-hidden="true"><span></span><span></span><span></span></div>
    <span class="thinking-text">{{extensionName}} is thinking...</span>
  </div>
  <!-- File Preview (shown when file is selected) -->
  <div class="file-preview" id="filePreview">
    <span class="file-preview-name" id="filePreviewName"></span>
    <button class="file-preview-remove" id="filePreviewRemove" title="Remove file" aria-label="Remove file">✕</button>
  </div>
  <div class="input-box">
    <button class="attach-btn" id="attachBtn" title="Attach file (images, PDF)" aria-label="Attach file">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14 8.5V11a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V5a3 3 0 0 1 3-3h2.5"/>
        <path d="M14 2v4h-4"/>
        <path d="M14 2L8 8"/>
      </svg>
    </button>
    <input type="file" id="fileInput" accept=".png,.jpg,.jpeg,.gif,.bmp,.webp,.pdf" hidden aria-hidden="true" />
    <textarea class="input-field" id="messageInput" placeholder="Ask anything..." rows="1" aria-label="Message input"></textarea>
    <button class="send-btn" id="sendBtn" title="Send (Enter)" aria-label="Send message">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14 2L7 9"/>
        <path d="M14 2L9.5 14L7 9L2 6.5L14 2Z"/>
      </svg>
    </button>
  </div>
  <div class="input-toolbar">
    {{modelSelectorHtml}}
  </div>
  <div class="input-hint" aria-hidden="true">Enter to send · Shift+Enter for new line · Attach images or PDFs</div>
</footer>
